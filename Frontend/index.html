<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sales Analytics</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <style>
    body {
      background: #e5e7eb;
      margin: 0;
      min-height: 100vh;
    }
    header {
      background: #1e293b;
      padding: 1rem 2rem;
    }
    nav {
      display: flex;
      justify-content: flex-start;
      gap: 0.75rem;
    }
    button {
      width: auto;
    }
    header nav button {
      background: #3b82f6;
      border-color: #3b82f6;
    }
    .sub-nav {
      margin-bottom: 1.5rem;
    }
    .sub-nav button {
      background: #64748b;
      border-color: #64748b;
    }
    .sub-nav button.active {
      background: #1e293b;
      border-color: #1e293b;
    }
    #metrics-filters {
      display: flex;
      gap: 0.75rem;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 1rem;
    }
    #metrics-filters input {
      width: auto;
      background: #f3f4f6;
      color: #111827;
    }
    #metrics-filters label {
      color: #111827;
      font-weight: 600;
    }
    #metrics-filters button {
      width: auto;
      background: #166534;
      border-color: #166534;
      color: white;
      margin: 0;
    }
    #metrics-filters label,
    #metrics-filters input {
      margin: 0;
    }
    main h3 {
      color: #111827;
      font-weight: 700;
    }
    main table {
      background: #f3f4f6;
      --pico-table-row-stripped-background-color: transparent;
      --pico-table-border-color: #d1d5db;
      color: #111827;
    }
    main {
      padding: 2rem;
    }
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
    }
    .kpi {
      background: #f3f4f6;
      padding: 1.5rem;
      border-radius: 0.5rem;
      border: 1px solid #d1d5db;
    }
    .kpi-value {
      font-size: 1.5rem;
      font-weight: 700;
      color: #111827;
    }
    .kpi-label {
      font-size: 0.875rem;
      color: #6b7280;
      margin-top: 0.25rem;
    }
    .period-info {
      color: #6b7280;
      font-size: 0.875rem;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>
  <header>
    <nav>
      <button data-view="upload">Subir CSV</button>
      <button data-view="metrics">Métricas</button>
      <button data-view="anomalies">Anomalías</button>
      <button data-view="summary">Resumen ejecutivo</button>
    </nav>
  </header>

  <main>
    <section id="upload" hidden>
      <form id="upload-form">
        <input type="file" id="csv-file" accept=".csv" required>
        <button type="submit">Subir</button>
      </form>
      <p id="upload-status"></p>
    </section>
    <section id="metrics" hidden>
      <nav class="sub-nav">
        <button data-metric="top-products" class="active">Top productos</button>
        <button data-metric="by-store">Ventas por tienda</button>
        <button data-metric="by-category">Ventas por categoría</button>
      </nav>

      <div class="metric-panel" data-metric="top-products">
        <h3>Top productos</h3>
        <form id="metrics-filters">
          <label>Desde <input type="date" id="date-start"></label>
          <label>Hasta <input type="date" id="date-end"></label>
          <label>Top N <input type="number" id="top-n" value="10" min="1" max="100"></label>
          <button type="submit">Aplicar</button>
        </form>
        <table id="top-products"></table>
      </div>

      <div class="metric-panel" data-metric="by-store" hidden>
        <h3>Ventas por tienda</h3>
        <table id="by-store"></table>
      </div>

      <div class="metric-panel" data-metric="by-category" hidden>
        <h3>Ventas por categoría</h3>
        <table id="by-category"></table>
      </div>
    </section>
    <section id="anomalies" hidden>
      <nav class="sub-nav">
        <button data-metric="quantity-le-0" class="active">Cantidad ≤ 0</button>
        <button data-metric="price-le-0">Precio ≤ 0</button>
      </nav>

      <div class="metric-panel" data-metric="quantity-le-0">
        <h3>Cantidad ≤ 0</h3>
        <table id="anomalies-quantity"></table>
      </div>

      <div class="metric-panel" data-metric="price-le-0" hidden>
        <h3>Precio unitario ≤ 0</h3>
        <table id="anomalies-price"></table>
      </div>
    </section>
    <section id="summary">
      <p id="period-info" class="period-info"></p>
      <div id="kpi-grid" class="kpi-grid"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
